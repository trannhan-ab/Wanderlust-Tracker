<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderlust Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

     AUTH SECTION

  <section id="auth-section">
    <div class="auth-bg">
      <div class="auth-orb auth-orb--1"></div>
      <div class="auth-orb auth-orb--2"></div>
      <div class="auth-orb auth-orb--3"></div>
    </div>

    <div class="auth-wrapper">
      <div class="auth-brand">
        <div class="auth-brand-icon"><i class="fas fa-plane-departure"></i></div>
        <h1>Wanderlust Tracker</h1>
        <p>Your personal travel planning &amp; budget hub</p>
      </div>

      <!-- Login Screen -->
      <div id="login-screen" class="auth-card">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to continue your journey</p>
        <div id="login-error" class="auth-error" style="display:none;"></div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-username">Username or Email</label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username">
            </div>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="pw-toggle" onclick="togglePw('login-password',this)" tabindex="-1">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary btn-full">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="#" onclick="showRegister(event)">Register now</a></p>
        <p class="auth-demo">Demo: username <strong>demo</strong> / password <strong>123456789</strong></p>
      </div>

      <!-- Register Screen -->
      <div id="register-screen" class="auth-card" style="display:none;">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join Wanderlust and start planning</p>
        <div id="register-error" class="auth-error" style="display:none;"></div>
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-fullname">Full Name</label>
            <div class="input-wrapper">
              <i class="fas fa-id-card input-icon"></i>
              <input type="text" id="reg-fullname" placeholder="Your full name">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="reg-email">Email</label>
              <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="reg-email" placeholder="email@example.com">
              </div>
            </div>
            <div class="form-group">
              <label for="reg-phone">Phone Number</label>
              <div class="input-wrapper">
                <i class="fas fa-phone input-icon"></i>
                <input type="tel" id="reg-phone" placeholder="0123456789">
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="reg-password">Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="reg-password" placeholder="Min. 6 characters">
                <button type="button" class="pw-toggle" onclick="togglePw('reg-password',this)" tabindex="-1"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            <div class="form-group">
              <label for="reg-confirm">Confirm Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="reg-confirm" placeholder="Repeat password">
                <button type="button" class="pw-toggle" onclick="togglePw('reg-confirm',this)" tabindex="-1"><i class="fas fa-eye"></i></button>
              </div>
            </div>
          </div>
          <button type="submit" class="btn-primary btn-full">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>
        <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin(event)">Sign in</a></p>
      </div>
    </div>
  </section>
